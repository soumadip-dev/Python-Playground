<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
</head>

<body data-page="contact" style="margin:0; font-family: Arial, sans-serif; background:#f4f4f9;">

  <!-- NAVBAR START -->
  <nav style="width:100%; background:#4a90e2; padding:10px 0; position:fixed; top:0; left:0;">
    <div style="max-width:900px; margin:auto; display:flex; justify-content:space-around;">
      <a href="/" data-link="home" style="color:#fff; text-decoration:none; padding:8px 12px;">Home</a>

      <a href="/about" data-link="about" style="color:#fff; text-decoration:none; padding:8px 12px;">About</a>

      <a href="/services" data-link="services" style="color:#fff; text-decoration:none; padding:8px 12px;">Services</a>

      <a href="/contact" data-link="contact" style="color:#fff; text-decoration:none; padding:8px 12px;">Contact</a>

    </div>
  </nav>
  <!-- NAVBAR END -->

  <!-- PAGE CONTENT -->
  <div
    style="max-width:600px; margin:120px auto; background:#fff; padding:30px; border-radius:10px; box-shadow:0 4px 10px rgba(0,0,0,0.1);">

    <h2 style="text-align:center; color:#4a90e2;">Contact Us</h2>
    <div>

      <form action="/contact" method="post" style="display:flex; flex-direction:column; gap:15px;">

        <input name="name" type="text" placeholder="Enter your name"
          style="padding:12px; border:1px solid #ccc; border-radius:6px; font-size:14px;">

        <input name="email" type="email" placeholder="Enter your email"
          style="padding:12px; border:1px solid #ccc; border-radius:6px; font-size:14px;">

        <button type="submit"
          style="padding:12px; background:#4a90e2; color:#fff; border:none; border-radius:6px; font-size:16px; cursor:pointer;">
          Send
        </button>

      </form>

    </div>

  </div>

</body>

</html>
