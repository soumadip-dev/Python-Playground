<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}{% endblock %}</title>
</head>

<body style="margin: 0; font-family: Arial, sans-serif; background-color: #fafafa">
  <nav style="
        display: flex;
        justify-content: center;
        font-size: 1.2em;
        padding: 12px 20px;
        background-color: #2c3e50;
        margin-bottom: 20px;
      ">
    <ul style="
          display: flex;
          list-style: none;
          gap: 30px;
          align-items: center;
          justify-content: center;
          margin: 0;
          padding: 0;
        ">
      <li><a href="/" style="color: white; text-decoration: none">Home</a></li>
      <li><a href="/about" style="color: white; text-decoration: none">About</a></li>
      <li><a href="/contact" style="color: white; text-decoration: none">Contact</a></li>
    </ul>
  </nav>

  <div style="max-width: 900px; margin: auto; padding: 100px">
    {% block content %}{% endblock %}
  </div>

  <footer style="
        margin-top: 40px;
        text-align: center;
        padding: 10px;
        background-color: #2c3e50;
        color: white;
      ">
    <p>&copy; footer</p>
  </footer>
</body>

</html>
